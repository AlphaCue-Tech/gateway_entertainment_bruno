info:
  name: get skills
  type: http
  seq: 4

http:
  method: GET
  url: "{{local_base}}/api/v1/skills/"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Skill list
    request:
      url: "{{local_base}}/api/v1/skills/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: date
          value: Sat, 09 May 2026 05:14:44 GMT
        - name: server
          value: WSGIServer/0.2 CPython/3.11.9
        - name: content-type
          value: application/json
        - name: vary
          value: Accept, origin
        - name: allow
          value: GET, HEAD, OPTIONS
        - name: x-frame-options
          value: DENY
        - name: content-length
          value: "169"
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
      body:
        type: json
        data: |-
          {
            "status_code": 200,
            "status": "success",
            "message": "Skills fetched.",
            "data": [
              {
                "id": 1,
                "name": "Lighting",
                "category": "Camera"
              },
              {
                "id": 2,
                "name": "Recorder",
                "category": "Camera"
              }
            ]
          }
